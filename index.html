<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleCare - Advanced Telemedicine Platform</title>
    <meta name="description" content="Professional telemedicine with real appointments, messaging, and health analytics">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-content { display: none; }
        .main-content.active { display: block; }

        /* AUTH */
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon { font-size: 48px; margin-bottom: 15px; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 12px;
            width: auto;
        }

        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .message-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        /* DASHBOARD */
        .dashboard-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 250px 1fr;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .sidebar .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .sidebar .user-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .nav-menu { list-style: none; }
        .nav-menu li { margin-bottom: 10px; }
        .nav-menu a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-menu a:hover { background: rgba(255,255,255,0.1); }
        .nav-menu a.active { background: rgba(255,255,255,0.2); font-weight: 600; }

        .logout-btn {
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .main-area {
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-height: 100vh;
        }

        .top-nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sections-container {
            padding: 40px;
            overflow-y: auto;
            flex: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }

        .header h1 { font-size: 28px; color: #333; }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .stat-label { font-size: 12px; opacity: 0.9; margin-bottom: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; }

        .section { display: none; }
        .section.active { display: block; }

        /* APPOINTMENTS */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            background: white;
        }

        .calendar-day:hover { border-color: #667eea; background: #f9f9ff; }
        .calendar-day.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .appointment-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .appointment-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #d1fae5; color: #065f46; }
        .status-completed { background: #dbeafe; color: #1e40af; }

        /* MESSAGING */
        .messaging-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            min-height: 600px;
        }

        .conversation-list {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .conversation-item:hover { background: #f9f9ff; }
        .conversation-item.active { background: #f0f4ff; border-left: 4px solid #667eea; }

        .chat-area {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .messages-display {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            max-height: 500px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .message-bubble {
            margin-bottom: 12px;
            display: flex;
        }

        .message-bubble.sent { justify-content: flex-end; }
        .message-bubble.received { justify-content: flex-start; }

        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
        }

        .message-bubble.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-bubble.received .message-content {
            background: #e0e0e0;
            color: #333;
        }

        .message-input {
            display: flex;
            gap: 10px;
        }

        .message-input textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            min-height: 60px;
        }

        /* ANALYTICS */
        .analytics-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        /* AVAILABILITY */
        .clinician-availability {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
        }

        .availability-day {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .availability-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .availability-inputs input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            width: 100px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            margin: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body { padding: 20px; }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        @media (max-width: 768px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .messaging-container { grid-template-columns: 1fr; }
            .analytics-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH SCREEN -->
        <div id="authScreen" class="main-content active">
            <div class="auth-container">
                <div class="logo-section">
                    <div class="logo-icon">🏥</div>
                    <h1>TeleCare</h1>
                    <p>Advanced Telemedicine Platform</p>
                </div>
                <div id="messageBox"></div>
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <button onclick="switchRole('patient')" class="btn btn-primary" id="patientRoleBtn" style="width: 100%;">Patient</button>
                    <button onclick="switchRole('clinician')" class="btn" id="clinicianRoleBtn" style="background: #f0f0f0; color: #333; width: 100%;">Clinician</button>
                </div>
                <div id="authForm"></div>
            </div>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboardScreen" class="main-content">
            <div class="dashboard-container">
                <div class="sidebar">
                    <div class="logo">🏥 TeleCare</div>
                    <div class="user-info">
                        <div style="font-weight: 600; margin-bottom: 5px;" id="userDisplayName">User</div>
                        <div style="opacity: 0.8; font-size: 12px;" id="userDisplayRole">Role</div>
                    </div>
                    <ul class="nav-menu" id="navMenu"></ul>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>

                <div class="main-area">
                    <div class="top-nav">
                        <span id="currentSectionTitle" style="font-weight: 600; font-size: 18px;"></span>
                    </div>

                    <div class="sections-container">
                        <!-- Dashboard Section -->
                        <div id="dashboard" class="section active">
                            <div class="header"><h1>Dashboard</h1></div>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                                <div class="stat-card">
                                    <div class="stat-label">Appointments</div>
                                    <div class="stat-value" id="statAppointments">0</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-label">Messages</div>
                                    <div class="stat-value" id="statMessages">0</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-label">Consultations</div>
                                    <div class="stat-value" id="statConsultations">0</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-label">Vital Records</div>
                                    <div class="stat-value" id="statVitals">0</div>
                                </div>
                            </div>
                            <div id="dashboardContent"></div>
                        </div>

                        <!-- Appointments Section -->
                        <div id="appointments" class="section">
                            <div class="header"><h1>Appointments</h1></div>
                            <button class="btn btn-primary btn-small" onclick="showBookAppointmentModal()" style="margin-bottom: 20px; width: 200px;">+ Book Appointment</button>
                            <div id="appointmentsContent"></div>
                        </div>

                        <!-- Messaging Section -->
                        <div id="messaging" class="section">
                            <div class="header"><h1>Messages</h1></div>
                            <div id="messagingContent"></div>
                        </div>

                        <!-- Health Analytics Section -->
                        <div id="health-analytics" class="section">
                            <div class="header"><h1>Health Trends & Analytics</h1></div>
                            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                                <input type="date" id="analyticsStartDate">
                                <input type="date" id="analyticsEndDate">
                                <button class="btn btn-primary btn-small" onclick="updateAnalytics()">Update Charts</button>
                            </div>
                            <div id="analyticsContent"></div>
                        </div>

                        <!-- Availability Section -->
                        <div id="availability" class="section">
                            <div class="header"><h1>My Availability</h1></div>
                            <div id="availabilityContent"></div>
                        </div>

                        <!-- Settings Section -->
                        <div id="settings" class="section">
                            <div class="header"><h1>Settings</h1></div>
                            <div id="settingsContent"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookAppointmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Book Appointment</h2>
                <button class="close-btn" onclick="closeModal('bookAppointmentModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="submitBookAppointment(event)">
                    <div class="form-group">
                        <label>Select Doctor</label>
                        <select id="appointmentDoctor" required></select>
                    </div>
                    <div class="form-group">
                        <label>Select Date</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    <div class="form-group">
                        <label>Select Time</label>
                        <select id="appointmentTime" required></select>
                    </div>
                    <div class="form-group">
                        <label>Chief Complaint</label>
                        <textarea id="appointmentReason" required style="height: 80px;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Book Appointment</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // DATA STORE
        let currentUser = null;
        let currentRole = 'patient';

        class DataStore {
            static init() {
                if (!localStorage.getItem('telecare_initialized')) {
                    this.initializeData();
                    localStorage.setItem('telecare_initialized', 'true');
                }
            }

            static initializeData() {
                const clinicians = [
                    { id: 'doc1', name: 'Dr. Sarah Johnson', specialty: 'General Practice', phone: '+254712345678', license: 'R01708/26', email: 'sarah@telecare.com', rating: 4.8, password: 'demo123' },
                    { id: 'doc2', name: 'Dr. James Kipchoge', specialty: 'Cardiology', phone: '+254722345678', license: 'R01709/26', email: 'james@telecare.com', rating: 4.9, password: 'demo123' },
                    { id: 'doc3', name: 'Dr. Maria Okoye', specialty: 'Pediatrics', phone: '+254732345678', license: 'R01710/26', email: 'maria@telecare.com', rating: 4.7, password: 'demo123' }
                ];
                const patients = [
                    { id: 'pat1', name: 'John Mwangi', phone: '+254721208979', email: 'john@email.com', password: 'demo123' },
                    { id: 'pat2', name: 'Alice Kipkemboi', phone: '+254721208980', email: 'alice@email.com', password: 'demo123' }
                ];
                localStorage.setItem('clinicians', JSON.stringify(clinicians));
                localStorage.setItem('patients', JSON.stringify(patients));
                localStorage.setItem('appointments', JSON.stringify([]));
                localStorage.setItem('messages', JSON.stringify([]));
                localStorage.setItem('vital_signs', JSON.stringify([]));
            }

            static getAll(key) {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            }

            static add(key, item) {
                const items = this.getAll(key);
                item.id = item.id || 'id_' + Date.now();
                items.push(item);
                localStorage.setItem(key, JSON.stringify(items));
                return item;
            }

            static update(key, id, updates) {
                const items = this.getAll(key);
                const index = items.findIndex(i => i.id === id);
                if (index !== -1) {
                    items[index] = {...items[index], ...updates};
                    localStorage.setItem(key, JSON.stringify(items));
                }
            }

            static delete(key, id) {
                const items = this.getAll(key);
                const filtered = items.filter(i => i.id !== id);
                localStorage.setItem(key, JSON.stringify(filtered));
            }
        }

        // AUTH
        function switchRole(role) {
            currentRole = role;
            document.getElementById('patientRoleBtn').style.background = role === 'patient' ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f0f0f0';
            document.getElementById('patientRoleBtn').style.color = role === 'patient' ? 'white' : '#333';
            document.getElementById('clinicianRoleBtn').style.background = role === 'clinician' ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f0f0f0';
            document.getElementById('clinicianRoleBtn').style.color = role === 'clinician' ? 'white' : '#333';
            renderAuthForm();
        }

        function renderAuthForm() {
            const form = document.getElementById('authForm');
            if (currentRole === 'patient') {
                form.innerHTML = `
                    <p style="color: #666; margin-bottom: 15px;">Demo: +254721208979 / demo123</p>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="authPhone" placeholder="+254...">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="authPassword" placeholder="Password">
                    </div>
                    <button class="btn btn-primary" onclick="login()">Login</button>
                    <button class="btn btn-primary" style="margin-top: 10px; background: #10b981;" onclick="register()">Register</button>
                `;
            } else {
                form.innerHTML = `
                    <p style="color: #666; margin-bottom: 15px;">Demo: R01708/26 / demo123</p>
                    <div class="form-group">
                        <label>License Number</label>
                        <input type="text" id="authLicense" placeholder="e.g., R01708/26">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="authPassword" placeholder="Password">
                    </div>
                    <button class="btn btn-primary" onclick="login()">Login</button>
                    <button class="btn btn-primary" style="margin-top: 10px; background: #10b981;" onclick="register()">Register</button>
                `;
            }
        }

        function login() {
            const messageBox = document.getElementById('messageBox');
            if (currentRole === 'patient') {
                const phone = document.getElementById('authPhone').value;
                const password = document.getElementById('authPassword').value;
                const patients = DataStore.getAll('patients');
                const patient = patients.find(p => p.phone === phone && p.password === password);
                if (patient) {
                    currentUser = {...patient, role: 'patient'};
                    showDashboard();
                } else {
                    messageBox.innerHTML = '<div class="message-box message-error">Invalid credentials</div>';
                }
            } else {
                const license = document.getElementById('authLicense').value;
                const password = document.getElementById('authPassword').value;
                const clinicians = DataStore.getAll('clinicians');
                const clinician = clinicians.find(c => c.license === license && c.password === password);
                if (clinician) {
                    currentUser = {...clinician, role: 'clinician'};
                    showDashboard();
                } else {
                    messageBox.innerHTML = '<div class="message-box message-error">Invalid credentials</div>';
                }
            }
        }

        function register() {
            const messageBox = document.getElementById('messageBox');
            if (currentRole === 'patient') {
                const phone = document.getElementById('authPhone').value;
                const password = document.getElementById('authPassword').value;
                if (!phone || !password) {
                    messageBox.innerHTML = '<div class="message-box message-error">Please fill all fields</div>';
                    return;
                }
                const newPatient = {id: 'pat_' + Date.now(), name: 'New Patient', phone, password, email: phone + '@telecare.com'};
                DataStore.add('patients', newPatient);
                currentUser = {...newPatient, role: 'patient'};
                messageBox.innerHTML = '<div class="message-box message-success">Registered! Welcome!</div>';
                setTimeout(() => showDashboard(), 1500);
            } else {
                const license = document.getElementById('authLicense').value;
                const password = document.getElementById('authPassword').value;
                if (!license || !password) {
                    messageBox.innerHTML = '<div class="message-box message-error">Please fill all fields</div>';
                    return;
                }
                const newClinician = {id: 'doc_' + Date.now(), name: 'New Clinician', license, password, specialty: 'General Practice', phone: '+254700000000', email: license + '@telecare.com', rating: 4.5};
                DataStore.add('clinicians', newClinician);
                currentUser = {...newClinician, role: 'clinician'};
                messageBox.innerHTML = '<div class="message-box message-success">Registered! Welcome!</div>';
                setTimeout(() => showDashboard(), 1500);
            }
        }

        // DASHBOARD
        function showDashboard() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('dashboardScreen').classList.add('active');
            document.getElementById('userDisplayName').textContent = currentUser.name;
            document.getElementById('userDisplayRole').textContent = currentUser.role === 'patient' ? 'Patient' : 'Healthcare Provider';
            updateNavMenu();
            showSection('dashboard');
            updateStats();
        }

        function updateNavMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            const items = [
                {id: 'dashboard', label: 'Dashboard', icon: '📊'},
                {id: 'appointments', label: 'Appointments', icon: '📅'},
                {id: 'messaging', label: currentUser.role === 'patient' ? 'Messages' : 'Patient Messages', icon: '💬'},
                {id: 'health-analytics', label: 'Health Analytics', icon: '📈'}
            ];
            if (currentUser.role === 'clinician') items.push({id: 'availability', label: 'My Availability', icon: '⏰'});
            items.push({id: 'settings', label: 'Settings', icon: '⚙️'});
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" onclick="showSection('${item.id}')" class="nav-link">${item.icon} ${item.label}</a>`;
                nav.appendChild(li);
            });
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('currentSectionTitle').textContent = sectionId.charAt(0).toUpperCase() + sectionId.slice(1).replace(/-/g, ' ');
            if (sectionId === 'dashboard') loadDashboard();
            else if (sectionId === 'appointments') loadAppointments();
            else if (sectionId === 'messaging') loadMessaging();
            else if (sectionId === 'health-analytics') loadAnalytics();
            else if (sectionId === 'availability') loadAvailability();
            else if (sectionId === 'settings') loadSettings();
        }

        function loadDashboard() {
            const appointments = DataStore.getAll('appointments').filter(a => currentUser.role === 'patient' ? a.patientId === currentUser.id : a.clinicianId === currentUser.id);
            const html = `<div style="background: white; border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px;"><h3 style="margin-bottom: 15px;">Upcoming Appointments</h3>${appointments.length === 0 ? '<p style="color: #999;">No appointments</p>' : appointments.slice(0, 5).map(apt => `<div style="padding: 12px; border-bottom: 1px solid #f0f0f0;"><div style="font-weight: 600;">${apt.clinicianName} - ${new Date(apt.date).toLocaleDateString()}</div><div style="font-size: 13px; color: #666;">${apt.time} • ${apt.reason}</div></div>`).join('')}</div>`;
            document.getElementById('dashboardContent').innerHTML = html;
        }

        function updateStats() {
            const appointments = DataStore.getAll('appointments').filter(a => currentUser.role === 'patient' ? a.patientId === currentUser.id : a.clinicianId === currentUser.id);
            const messages = DataStore.getAll('messages').filter(m => m.senderId === currentUser.id || m.recipientId === currentUser.id);
            const vitals = DataStore.getAll('vital_signs').filter(v => v.patientId === currentUser.id);
            document.getElementById('statAppointments').textContent = appointments.length;
            document.getElementById('statMessages').textContent = messages.length;
            document.getElementById('statConsultations').textContent = Math.floor(Math.random() * 10);
            document.getElementById('statVitals').textContent = vitals.length;
        }

        function loadAppointments() {
            const appointments = DataStore.getAll('appointments').filter(a => currentUser.role === 'patient' ? a.patientId === currentUser.id : a.clinicianId === currentUser.id);
            const html = appointments.map(apt => `<div class="appointment-card"><div style="display: flex; justify-content: space-between;"><div><div style="font-weight: 600; font-size: 16px; margin-bottom: 8px;">${currentUser.role === 'patient' ? apt.clinicianName : apt.patientName}</div><div style="color: #666;">📅 ${new Date(apt.date).toLocaleDateString()} at ${apt.time}</div><div style="color: #666;">🩺 ${apt.reason}</div></div><span class="status-badge status-${apt.status}">${apt.status}</span></div></div>`).join('');
            document.getElementById('appointmentsContent').innerHTML = html || '<p style="color: #999;">No appointments</p>';
        }

        function showBookAppointmentModal() {
            const clinicians = DataStore.getAll('clinicians');
            const select = document.getElementById('appointmentDoctor');
            select.innerHTML = '<option value="">Choose a doctor...</option>';
            clinicians.forEach(doc => select.innerHTML += `<option value="${doc.id}">${doc.name} - ${doc.specialty}</option>`);
            document.getElementById('bookAppointmentModal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function submitBookAppointment(event) {
            event.preventDefault();
            const doctorId = document.getElementById('appointmentDoctor').value;
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;
            const reason = document.getElementById('appointmentReason').value;
            if (!doctorId || !date || !time || !reason) {alert('Fill all fields'); return;}
            const doctor = DataStore.getAll('clinicians').find(d => d.id === doctorId);
            const appointment = {id: 'apt_' + Date.now(), patientId: currentUser.id, patientName: currentUser.name, clinicianId: doctorId, clinicianName: doctor.name, date, time, reason, status: 'pending', createdAt: new Date().toISOString()};
            DataStore.add('appointments', appointment);
            closeModal('bookAppointmentModal');
            alert('Appointment requested!');
            loadAppointments();
            updateStats();
        }

        function loadMessaging() {
            const messages = DataStore.getAll('messages').filter(m => m.senderId === currentUser.id || m.recipientId === currentUser.id);
            const conversations = {};
            messages.forEach(msg => {
                const otherId = msg.senderId === currentUser.id ? msg.recipientId : msg.senderId;
                const otherName = msg.senderId === currentUser.id ? msg.recipientName : msg.senderName;
                if (!conversations[otherId]) conversations[otherId] = {name: otherName, messages: []};
                conversations[otherId].messages.push(msg);
            });
            const html = `<div class="messaging-container"><div class="conversation-list">${Object.entries(conversations).length === 0 ? '<p style="color: #999; text-align: center; padding: 20px;">No messages</p>' : Object.entries(conversations).map(([userId, conv]) => `<div class="conversation-item" onclick="openConversation('${userId}', '${conv.name}')"><div style="font-weight: 600; font-size: 14px;">${conv.name}</div><div style="font-size: 12px; color: #999; margin-top: 4px;">${conv.messages[conv.messages.length - 1].message.substring(0, 30)}...</div></div>`).join('')}</div><div class="chat-area"><div style="text-align: center; color: #999; padding: 40px;">Select a conversation</div></div></div>`;
            document.getElementById('messagingContent').innerHTML = html;
        }

        function openConversation(userId, userName) {
            const messages = DataStore.getAll('messages').filter(m => (m.senderId === currentUser.id && m.recipientId === userId) || (m.senderId === userId && m.recipientId === currentUser.id));
            const messagesHtml = messages.map(msg => `<div class="message-bubble ${msg.senderId === currentUser.id ? 'sent' : 'received'}"><div class="message-content">${msg.message}<div style="font-size: 11px; color: #999; margin-top: 5px;">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div></div></div>`).join('');
            const html = `<div class="messaging-container"><div class="conversation-list"></div><div class="chat-area"><div style="font-weight: 600; font-size: 16px; margin-bottom: 15px;">${userName}</div><div class="messages-display">${messagesHtml || '<p style="text-align: center; color: #999;">No messages yet</p>'}</div><div class="message-input"><textarea id="messageInput" placeholder="Type a message..."></textarea><button class="btn btn-primary btn-small" onclick="sendMessage('${userId}')" style="height: 60px; width: auto;">Send</button></div></div></div>`;
            document.getElementById('messagingContent').innerHTML = html;
        }

        function sendMessage(recipientId) {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            const recipient = DataStore.getAll(currentUser.role === 'patient' ? 'clinicians' : 'patients').find(u => u.id === recipientId);
            const msg = {id: 'msg_' + Date.now(), senderId: currentUser.id, senderName: currentUser.name, recipientId, recipientName: recipient.name, message, timestamp: new Date().toISOString(), read: false};
            DataStore.add('messages', msg);
            input.value = '';
            openConversation(recipientId, recipient.name);
            updateStats();
        }

        function loadAnalytics() {
            const startDate = document.getElementById('analyticsStartDate');
            const endDate = document.getElementById('analyticsEndDate');
            const end = new Date();
            const start = new Date(end.getTime() - 30 * 24 * 60 * 60 * 1000);
            startDate.valueAsDate = start;
            endDate.valueAsDate = end;
            const html = `<div class="analytics-container"><div class="chart-card"><h3>Blood Pressure Trend</h3><canvas id="bpChart"></canvas></div><div class="chart-card"><h3>Weight Tracking</h3><canvas id="weightChart"></canvas></div><div class="chart-card"><h3>Heart Rate</h3><canvas id="hrChart"></canvas></div><div class="chart-card"><h3>Blood Sugar</h3><canvas id="bsChart"></canvas></div></div>`;
            document.getElementById('analyticsContent').innerHTML = html;
            setTimeout(() => updateAnalytics(), 100);
        }

        function updateAnalytics() {
            const vitals = DataStore.getAll('vital_signs').filter(v => v.patientId === currentUser.id);
            if (vitals.length === 0) {
                document.getElementById('analyticsContent').innerHTML = '<p style="color: #999; text-align: center; padding: 40px;">No vital signs data. Log your vitals to see trends.</p>';
                return;
            }
            const sorted = vitals.sort((a, b) => new Date(a.date) - new Date(b.date));
            const labels = sorted.map(v => new Date(v.date).toLocaleDateString());
            if (document.getElementById('bpChart')) new Chart(document.getElementById('bpChart'), {type: 'line', data: {labels, datasets: [{label: 'Systolic', data: sorted.map(v => v.bpSystolic || 0), borderColor: '#ff6b6b', tension: 0.4}, {label: 'Diastolic', data: sorted.map(v => v.bpDiastolic || 0), borderColor: '#4ecdc4', tension: 0.4}]}, options: {responsive: true, plugins: {legend: {display: true}}}});
            if (document.getElementById('weightChart')) new Chart(document.getElementById('weightChart'), {type: 'line', data: {labels, datasets: [{label: 'Weight (kg)', data: sorted.map(v => v.weight || 0), borderColor: '#667eea', backgroundColor: 'rgba(102, 126, 234, 0.1)', tension: 0.4, fill: true}]}, options: {responsive: true, plugins: {legend: {display: true}}}});
            if (document.getElementById('hrChart')) new Chart(document.getElementById('hrChart'), {type: 'line', data: {labels, datasets: [{label: 'Heart Rate (bpm)', data: sorted.map(v => v.heartRate || 0), borderColor: '#f09433', backgroundColor: 'rgba(240, 148, 51, 0.1)', tension: 0.4, fill: true}]}, options: {responsive: true, plugins: {legend: {display: true}}}});
            if (document.getElementById('bsChart')) new Chart(document.getElementById('bsChart'), {type: 'line', data: {labels, datasets: [{label: 'Blood Sugar (mg/dL)', data: sorted.map(v => v.bloodSugar || 0), borderColor: '#a29bfe', backgroundColor: 'rgba(162, 155, 254, 0.1)', tension: 0.4, fill: true}]}, options: {responsive: true, plugins: {legend: {display: true}}}});
        }

        function loadAvailability() {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const availability = JSON.parse(localStorage.getItem('clinician_availability') || '{}')[currentUser.id] || {};
            const html = `<div class="clinician-availability"><div style="margin-bottom: 20px;"><h3 style="margin-bottom: 15px; color: #333;">Set Working Hours</h3>${days.map(day => `<div class="availability-day"><div style="font-weight: 600; color: #333;">${day}</div><div class="availability-inputs"><input type="time" id="start_${day}" value="${availability[day]?.start || '09:00'}" onchange="saveAvailability()"><span>to</span><input type="time" id="end_${day}" value="${availability[day]?.end || '17:00'}" onchange="saveAvailability()"><div style="display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="active_${day}" ${availability[day]?.active ? 'checked' : ''} onchange="saveAvailability()"><label for="active_${day}">Active</label></div></div></div>`).join('')}</div></div>`;
            document.getElementById('availabilityContent').innerHTML = html;
        }

        function saveAvailability() {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const availability = {};
            days.forEach(day => {
                availability[day] = {start: document.getElementById(`start_${day}`).value, end: document.getElementById(`end_${day}`).value, active: document.getElementById(`active_${day}`).checked};
            });
            const allAvailability = JSON.parse(localStorage.getItem('clinician_availability') || '{}');
            allAvailability[currentUser.id] = availability;
            localStorage.setItem('clinician_availability', JSON.stringify(allAvailability));
            alert('Availability updated!');
        }

        function loadSettings() {
            const html = `<div style="background: white; border: 2px solid #e0e0e0; border-radius: 12px; padding: 20px; max-width: 500px;"><h3 style="margin-bottom: 20px;">Account Info</h3><div class="form-group"><label>Name</label><input type="text" value="${currentUser.name}" readonly style="background: #f9f9f9;"></div><div class="form-group"><label>${currentUser.role === 'patient' ? 'Phone' : 'License'}</label><input type="text" value="${currentUser.role === 'patient' ? currentUser.phone : currentUser.license}" readonly style="background: #f9f9f9;"></div><div class="form-group"><label>Email</label><input type="email" value="${currentUser.email}" readonly style="background: #f9f9f9;"></div></div>`;
            document.getElementById('settingsContent').innerHTML = html;
        }

        function logout() {
            if (confirm('Logout?')) {
                currentUser = null;
                document.getElementById('dashboardScreen').classList.remove('active');
                document.getElementById('authScreen').classList.add('active');
                switchRole('patient');
                renderAuthForm();
            }
        }

        // ========================================
        // MOBILE FEATURES & PWA ENHANCEMENTS
        // ========================================

        // Service Worker Registration
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration);

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('📱 App update available');
                                    showUpdateNotification();
                                }
                            });
                        });
                    })
                    .catch(error => console.log('❌ Service Worker registration failed:', error));
            }
        }

        function showUpdateNotification() {
            const updateBanner = document.createElement('div');
            updateBanner.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; text-align: center; z-index: 9999; font-weight: 600;';
            updateBanner.innerHTML = '🆕 App update available! <button onclick="location.reload()" style="background: white; color: #667eea; border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; margin-left: 10px; font-weight: 600;">Reload</button>';
            document.body.insertBefore(updateBanner, document.body.firstChild);
        }

        // Push Notifications
        function enablePushNotifications() {
            if (!('Notification' in window)) {
                console.log('Push notifications not supported');
                return;
            }

            if (Notification.permission === 'granted') {
                initPushNotifications();
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        initPushNotifications();
                    }
                });
            }
        }

        function initPushNotifications() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                navigator.serviceWorker.ready.then(registration => {
                    registration.pushManager.getSubscription().then(subscription => {
                        if (!subscription) {
                            // Subscribe to push notifications
                            registration.pushManager.subscribe({
                                userVisibleOnly: true,
                                applicationServerKey: 'BP4'
                            }).then(subscription => {
                                console.log('✅ Push notifications enabled');
                                localStorage.setItem('push_subscription', JSON.stringify(subscription));
                            }).catch(error => console.log('Push notification setup failed:', error));
                        }
                    });
                });
            }
        }

        // Offline Indicator
        function setupOfflineIndicator() {
            const updateOnlineStatus = () => {
                if (navigator.onLine) {
                    document.body.style.opacity = '1';
                    console.log('🟢 Online');
                } else {
                    document.body.style.opacity = '0.8';
                    showOfflineNotification();
                }
            };

            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        }

        function showOfflineNotification() {
            const notification = document.createElement('div');
            notification.style.cssText = 'position: fixed; bottom: 20px; right: 20px; background: #ff6b6b; color: white; padding: 15px 20px; border-radius: 8px; z-index: 9998;';
            notification.innerHTML = '📵 You\'re offline - using cached data';
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 4000);
        }

        // Installation Prompt
        let installPrompt = null;

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            installPrompt = event;
            console.log('📲 Install prompt available');
            showInstallButton();
        });

        function showInstallButton() {
            const installBtn = document.createElement('button');
            installBtn.innerHTML = '📱 Install App';
            installBtn.style.cssText = 'position: fixed; top: 80px; right: 20px; background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; z-index: 1000; font-weight: 600;';
            installBtn.onclick = () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    installPrompt.userChoice.then(choice => {
                        if (choice.outcome === 'accepted') {
                            console.log('✅ App installed');
                        }
                        installPrompt = null;
                        installBtn.remove();
                    });
                }
            };
            document.body.appendChild(installBtn);
        }

        window.addEventListener('appinstalled', () => {
            console.log('✅ App successfully installed');
            localStorage.setItem('app_installed', 'true');
        });

        // Send Notifications
        function sendNotification(title, options = {}) {
            if ('serviceWorker' in navigator && 'Notification' in window) {
                navigator.serviceWorker.ready.then(registration => {
                    registration.showNotification(title, {
                        icon: '/icon-192.png',
                        badge: '/icon-192.png',
                        ...options
                    });
                });
            }
        }

        // Appointment Reminder
        function scheduleAppointmentReminder(appointment) {
            const now = new Date();
            const appointmentTime = new Date(appointment.date);
            const reminderTime = new Date(appointmentTime.getTime() - 60 * 60 * 1000); // 1 hour before

            if (reminderTime > now) {
                const timeUntilReminder = reminderTime.getTime() - now.getTime();
                setTimeout(() => {
                    sendNotification('📅 Appointment Reminder', {
                        body: `Your appointment with ${appointment.doctorName || 'Dr.'} is in 1 hour`,
                        tag: 'appointment-reminder',
                        data: { url: '/?mode=patient' }
                    });
                }, timeUntilReminder);
            }
        }

        // Initialize Mobile Features
        window.addEventListener('DOMContentLoaded', () => {
            DataStore.init();

            // Mobile PWA Features
            registerServiceWorker();
            setupOfflineIndicator();
            enablePushNotifications();

            switchRole('patient');
            renderAuthForm();

            console.log('📱 Mobile features initialized');
        });
    </script>
</body>
</html>
